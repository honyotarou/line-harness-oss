name = "line-harness-admin-access-proxy"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Secrets policy:
# - Do NOT put sensitive values under [vars] (plaintext, committed & deployed).
# - Use Worker secrets for sensitive values like Cloudflare Access service tokens.
#   - CF_ACCESS_CLIENT_ID
#   - CF_ACCESS_CLIENT_SECRET
# Official docs: https://developers.cloudflare.com/workers/configuration/secrets/

# Custom routes: optional. GitHub Actions appends `routes = [...]` when secrets
# ADMIN_ACCESS_PROXY_ROUTE_PATTERN + ADMIN_ACCESS_PROXY_ZONE_NAME are set
# (see deploy-admin-access-proxy.yml). Otherwise the Worker is reachable on *.workers.dev only.

[vars]
UPSTREAM_API_ORIGIN = "https://YOUR_UPSTREAM_API_ORIGIN"
PATH_PREFIX = "/api/lh-upstream"
