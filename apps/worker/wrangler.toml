name = "line-crm-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true

# API_KEY is set via `wrangler secret put API_KEY`
# Do NOT hardcode secrets here
#
# Caution: every `wrangler deploy` uploads [vars] below. Placeholders overwrite
# dashboard edits unless you use wrangler.local.toml (local) or CI injects URLs
# (see .github/workflows/deploy-worker.yml + GitHub Secrets WORKER_URL / WEB_URL).

[vars]
# Replace with your deployed URLs (or override in wrangler.local.toml, gitignored).
WORKER_URL = "https://YOUR_SUBDOMAIN.workers.dev"
WEB_URL = "https://YOUR_PROJECT.vercel.app"
# Required for /auth/line (friend-add flow). Keep as placeholder in repo defaults.
LIFF_URL = "https://liff.line.me/YOUR_LIFF_ID"
# Defaults keep Access off for forks; CI replaces when GitHub Secrets are set (see deploy-worker.yml).
REQUIRE_CLOUDFLARE_ACCESS_JWT = "0"
CLOUDFLARE_ACCESS_TEAM_DOMAIN = ""
# Same-origin BFF (admin-access-proxy Worker): comma-separated service token client ids (*.access).
# CI: set GitHub Secret CLOUDFLARE_ACCESS_TRUSTED_SERVICE_CLIENT_IDS (see deploy-worker.yml).
CLOUDFLARE_ACCESS_TRUSTED_SERVICE_CLIENT_IDS = ""
# Same-site admin BFF (`/api/lh-upstream` → admin-access-proxy Worker → upstream API): the browser may
# not persist `lh_admin_session` from the API host's Set-Cookie. Set to "1" so POST /api/auth/login
# JSON includes `sessionToken` for Authorization: Bearer + sessionStorage (see auth-route-helpers).
# CI: optional GitHub Repository Secret LH_SESSION_TOKEN_IN_LOGIN_BODY → this var (see deploy-worker.yml).
INCLUDE_SESSION_TOKEN_IN_LOGIN_BODY = "0"
# ALLOWED_ORIGINS = "https://admin.example.com,https://preview.example.com"
#
# Cloudflare Zero Trust / Access (optional extras; set in dashboard or extend CI sed)
# CLOUDFLARE_ACCESS_ALLOWED_EMAILS = "you@company.com,coworker@company.com"
# CLOUDFLARE_ACCESS_AUDIENCE = "<Access application audience UUID or tag from JWT aud claim>"
#
# Optional: HMAC secret for admin session cookies (local/dev may fall back to API_KEY; non-local HTTPS refuses API_KEY signing by default)
# ADMIN_SESSION_SECRET = "use wrangler secret put ADMIN_SESSION_SECRET in production"
#
# Optional: Host header allowlist (comma-separated). When set, requests with other Host values get 403.
# Example: ALLOWED_HOSTNAMES = "your-subdomain.workers.dev,api.yourdomain.com"
#
# Public OpenAPI (/openapi.json): off by default. Set ENABLE_PUBLIC_OPENAPI = "1" to expose; production hardening:
# DISABLE_PUBLIC_OPENAPI = "1"   (always wins — forces off)
#
# Cloudflare Bot Management (optional; reduces scripted login / affiliate-click abuse):
# MIN_CF_BOT_SCORE = "30"
# REQUIRE_CF_BOT_SIGNAL = "1"   (403 if cf.botManagement.score is missing on protected POSTs; dev/local usually off)
#
# Multi-account on one Worker: force explicit lineAccountId on list APIs (friends, broadcasts, line-accounts, …)
# MULTI_LINE_ACCOUNT_QUERY_REQUIRES_LINE_ACCOUNT_ID = "1"
#
# REQUIRE_LIFF_STATE_SECRET = "1"   OAuth state must use wrangler secret LIFF_STATE_SECRET (no API_KEY fallback)
# ALLOW_LIFF_OAUTH_API_KEY_FALLBACK = "1"   local/dev only: sign OAuth state with API_KEY when LIFF_STATE_SECRET unset
# LINE_ACCOUNT_SECRETS_KEY = "<base64 of 32 bytes>"   AES-GCM at-rest for line_accounts tokens (`lh1:` in D1); required on non-local HTTPS for POST /api/line-accounts unless:
# ALLOW_LINE_ACCOUNT_SECRETS_PLAINTEXT_AT_REST = "1"   migration only (stores channel secrets as plaintext in D1)
#
# Non-local HTTPS: cookie-based admin POSTs reject well-known X-Line-Harness-Client: 1 unless you set a shared random:
# ADMIN_BROWSER_CLIENT_TOKEN = "<long random>"   (same value as web NEXT_PUBLIC_ADMIN_BROWSER_CLIENT_TOKEN), or dev-only:
# ALLOW_DEFAULT_ADMIN_BROWSER_CLIENT = "1"
#
# Staging / migration on non-local HTTPS: `RELAX_DEPLOYED_SECURITY_DEFAULTS=1` alone does nothing; also set:
# RELAX_DEPLOYED_SECURITY_CONFIRM = "YES_I_ACCEPT_REDUCED_SECURITY"
#
# REQUIRE_ADMIN_SESSION_SECRET = "1"   plus wrangler secret put ADMIN_SESSION_SECRET — sessions must not use API_KEY as HMAC
# Non-local HTTPS WORKER_URL also refuses API_KEY-backed session signing unless ADMIN_SESSION_SECRET is set (or transitional ALLOW_LEGACY_API_KEY_SESSION_SIGNER=1).
# BROADCAST_SEND_SECRET = "<long random>"   plus header X-Broadcast-Send-Secret on mass send endpoints
# REQUIRE_BROADCAST_SEND_SECRET = "1"   refuse mass send until BROADCAST_SEND_SECRET is configured
#
# LINE_ACCOUNT_SECRETS_WRITE_SECRET = "<long random>"   plus X-Line-Account-Secrets-Write to rotate channel token/secret (PUT /api/line-accounts/:id)
# ALLOW_LINE_ACCOUNT_CREDENTIAL_PUT_WITHOUT_EXTRA_SECRET = "1"   dev-only: skip the above guard (insecure)
# REQUIRE_OWNER_DB_ROLE_FOR_LINE_CREDENTIALS = "1"   with Access JWT: explicit admin_principal_roles row must be role owner to create accounts or rotate credentials (no row = legacy full admin)
#
# Webhook secrets at rest: uses the same LINE_ACCOUNT_SECRETS_KEY envelope (`lh1:`) when configured.
# ALLOW_WEBHOOK_SECRETS_PLAINTEXT_AT_REST = "1"   migration only (stores webhook secrets as plaintext in D1)
#
# Optional: comma-separated host allowlist for automation action send_webhook only (exact host or `.suffix`).
# AUTOMATION_SEND_WEBHOOK_ALLOWED_HOSTS = "hooks.slack.com,.mycompany.com"
# REQUIRE_AUTOMATION_SEND_WEBHOOK_ALLOWED_HOSTS = "1"   refuse send_webhook unless allowlist is non-empty
# ALLOW_AUTOMATION_SEND_WEBHOOK_FROM_INCOMING_WEBHOOK = "1"   unsafe default off: lets partner incoming webhooks chain to send_webhook
#
# Legacy only: allow Bearer raw API_KEY on GET /api/auth/session (default: off)
# ALLOW_LEGACY_API_KEY_BEARER_SESSION = "1"
#
# Read-only staff (RBAC): when REQUIRE_CLOUDFLARE_ACCESS_JWT is on, insert rows into D1 table
# admin_principal_roles (email, role) with role='viewer' to block POST/PUT/PATCH/DELETE except
# /api/auth/login and /api/auth/logout. No row for an email = full admin (default) unless:
# REQUIRE_ADMIN_PRINCIPAL_ALLOWLIST = "1"
#   → only emails with a row may use the API; empty table → only /api/admin/principal-roles until you add a row.
# Apply schema: packages/db/schema.sql, or incremental pnpm db:apply-011:remote (migrations/011_admin_principal_roles.sql).
#
# Cloudflare / D1 ops (not enforced by code): use least-privilege API tokens; separate prod account
# or restrict dashboard access; deploy via CI only; enable audit logs in Zero Trust.

# 実 database_id は wrangler.local.toml に置く（gitignore）。Wrangler 3 は自動マージしないため、
# `pnpm dev` / `deploy` と `pnpm db:apply-*` / d1 系スクリプトは `-c wrangler.local.toml` を付与する。
[[d1_databases]]
binding = "DB"
database_name = "line-crm"
database_id = "YOUR_D1_DATABASE_ID"

# Optional: image uploads for broadcasts / Flex (`POST /api/images`, public fetch `GET /api/images/public/:token`).
# Create bucket in dashboard, then uncomment and set bucket_name (binding name must stay LINE_CRM_IMAGES).
# CI: set GitHub Repository Secret WORKER_LINE_CRM_IMAGES_BUCKET_NAME to append `[[r2_buckets]]` on deploy (see deploy-worker.yml).
# [[r2_buckets]]
# binding = "LINE_CRM_IMAGES"
# bucket_name = "line-crm-images"
#
# Optional: `AD_PLATFORM_OUTBOUND_ENABLED=1` — enables `POST /api/ad-platforms/:id/sync` (HTTPS credential checks vs Meta / Google / X / TikTok; see ad-platform-outbound-sync.ts). Default: sync returns 501.

[triggers]
crons = ["*/5 * * * *"]
