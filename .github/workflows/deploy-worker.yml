name: Deploy Worker

# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (required for deploy).
# Prefer a token scoped to this Worker + D1 only (not account-wide). Rotate periodically.
# Human operators should not need production dashboard access if CI deploys; use separate CF subaccounts for prod vs dev when possible.
#
# Production surface (set via `wrangler secret put` / dashboard / vars — not committed):
# - API_KEY, ADMIN_SESSION_SECRET, LINE_*, STRIPE_WEBHOOK_SECRET, etc. — never in git.
# - DISABLE_PUBLIC_OPENAPI=1 unless you intentionally expose /openapi.json.
# - ALLOWED_HOSTNAMES for your API hostname(s).
# - REQUIRE_CLOUDFLARE_ACCESS_JWT + CLOUDFLARE_ACCESS_TEAM_DOMAIN: set as GitHub Secrets; CI injects into wrangler.toml before deploy (dashboard-only edits are overwritten every deploy).
# - CLOUDFLARE_ACCESS_TRUSTED_SERVICE_CLIENT_IDS: optional; GitHub Secret → wrangler.toml (admin-access-proxy service token client id(s), *.access).
# - LH_SESSION_TOKEN_IN_LOGIN_BODY: optional GitHub Repository Secret (name is [A-Za-z0-9_] only). CI injects Worker var INCLUDE_SESSION_TOKEN_IN_LOGIN_BODY in wrangler.toml — set secret value "1" when admin UI uses /api/lh-upstream BFF and browsers cannot persist lh_admin_session cookie.
# - Optional WAF/Bot: enable Cloudflare Bot Management on the zone, then MIN_CF_BOT_SCORE (e.g. 30) on the Worker.
# - Multi LINE accounts on one Worker: MULTI_LINE_ACCOUNT_QUERY_REQUIRES_LINE_ACCOUNT_ID=1
# - REQUIRE_ADMIN_SESSION_SECRET=1 + ADMIN_SESSION_SECRET (wrangler secret) so sessions are not signed with API_KEY
# - BROADCAST_SEND_SECRET + X-Broadcast-Send-Secret header for /api/broadcasts/:id/send (second factor for mass send)
# - AUTOMATION_SEND_WEBHOOK_ALLOWED_HOSTS: GitHub Secret (comma-separated hostnames) required for HTTPS deploy unless SKIP_CI_AUTOMATION_WEBHOOK_ALLOWLIST_CHECK=1
#
# After schema changes (e.g. admin_principal_roles), run D1 migrations against remote before relying on new features.

# Runs on every push to `main` (no path filter) so GitHub Repository secrets are re-applied to Cloudflare each commit.
# `GITHUB_TOKEN` cannot chain-trigger other workflows — do not use gh workflow run for deploys.
# Manual: Actions → Deploy Worker → Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-deploy-line-crm-worker-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @line-crm/shared --filter @line-crm/line-sdk --filter @line-crm/db build

      # Fail fast on missing production-critical secrets.
      # Note: Worker "wrangler secret put" values are managed outside git; this checks only GitHub-injected vars.
      - name: Fail on missing required deploy secrets
        working-directory: apps/worker
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          # These two are injected into wrangler.toml to enforce Cloudflare Access on deploy.
          REQUIRE_CLOUDFLARE_ACCESS_JWT: ${{ secrets.REQUIRE_CLOUDFLARE_ACCESS_JWT }}
          CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${{ secrets.CLOUDFLARE_ACCESS_TEAM_DOMAIN }}
          AUTOMATION_SEND_WEBHOOK_ALLOWED_HOSTS: ${{ secrets.AUTOMATION_SEND_WEBHOOK_ALLOWED_HOSTS }}
          SKIP_CI_AUTOMATION_WEBHOOK_ALLOWLIST_CHECK: ${{ secrets.SKIP_CI_AUTOMATION_WEBHOOK_ALLOWLIST_CHECK }}
        run: |
          fail=0
          if [ -z "$WORKER_URL" ]; then
            echo "Missing GitHub Secret: WORKER_URL" >&2
            fail=1
          fi
          if echo "$WORKER_URL" | grep -qE '^https://'; then
            if [ -z "$REQUIRE_CLOUDFLARE_ACCESS_JWT" ] || [ -z "$CLOUDFLARE_ACCESS_TEAM_DOMAIN" ]; then
              echo "Missing GitHub Secrets for HTTPS deploy: REQUIRE_CLOUDFLARE_ACCESS_JWT and/or CLOUDFLARE_ACCESS_TEAM_DOMAIN" >&2
              fail=1
            fi
            if [ "${SKIP_CI_AUTOMATION_WEBHOOK_ALLOWLIST_CHECK:-}" != "1" ]; then
              if [ -z "${AUTOMATION_SEND_WEBHOOK_ALLOWED_HOSTS:-}" ]; then
                echo "Missing GitHub Secret: AUTOMATION_SEND_WEBHOOK_ALLOWED_HOSTS (comma-separated hostnames for automation send_webhook allowlist). Set SKIP_CI_AUTOMATION_WEBHOOK_ALLOWLIST_CHECK=1 only for exceptional staging." >&2
                fail=1
              fi
            fi
          fi
          exit $fail

      - name: Inject D1 database id (optional; when wrangler.toml uses YOUR_D1_DATABASE_ID)
        working-directory: apps/worker
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [ -n "$D1_DATABASE_ID" ]; then
            sed -i.bak "s|YOUR_D1_DATABASE_ID|$D1_DATABASE_ID|g" wrangler.toml && rm -f wrangler.toml.bak
          fi

      # Without this, deploy overwrites Worker vars with wrangler.toml placeholders and breaks CORS.
      - name: Inject WORKER_URL / WEB_URL / LIFF_URL (optional; GitHub Secrets)
        working-directory: apps/worker
        env:
          INJECT_WORKER_URL: ${{ secrets.WORKER_URL }}
          INJECT_WEB_URL: ${{ secrets.WEB_URL }}
          INJECT_LIFF_URL: ${{ secrets.LIFF_URL }}
        run: |
          if [ -n "$INJECT_WORKER_URL" ]; then
            sed -i.bak "s|https://YOUR_SUBDOMAIN.workers.dev|$INJECT_WORKER_URL|g" wrangler.toml && rm -f wrangler.toml.bak
          fi
          if [ -n "$INJECT_WEB_URL" ]; then
            sed -i.bak "s|https://YOUR_PROJECT.vercel.app|$INJECT_WEB_URL|g" wrangler.toml && rm -f wrangler.toml.bak
          fi
          if [ -n "$INJECT_LIFF_URL" ]; then
            sed -i.bak "s|https://liff.line.me/YOUR_LIFF_ID|$INJECT_LIFF_URL|g" wrangler.toml && rm -f wrangler.toml.bak
          fi

      # Without this, each deploy uploads wrangler.toml [vars] and clears dashboard-only Access toggles.
      - name: Inject Cloudflare Access vars (optional; GitHub Secrets)
        working-directory: apps/worker
        env:
          INJECT_CF_ACCESS_JWT: ${{ secrets.REQUIRE_CLOUDFLARE_ACCESS_JWT }}
          INJECT_CF_ACCESS_DOMAIN: ${{ secrets.CLOUDFLARE_ACCESS_TEAM_DOMAIN }}
        run: |
          if [ -n "$INJECT_CF_ACCESS_JWT" ] && [ -n "$INJECT_CF_ACCESS_DOMAIN" ]; then
            sed -i.bak "s|^REQUIRE_CLOUDFLARE_ACCESS_JWT = .*|REQUIRE_CLOUDFLARE_ACCESS_JWT = \"${INJECT_CF_ACCESS_JWT}\"|" wrangler.toml
            sed -i.bak "s|^CLOUDFLARE_ACCESS_TEAM_DOMAIN = .*|CLOUDFLARE_ACCESS_TEAM_DOMAIN = \"${INJECT_CF_ACCESS_DOMAIN}\"|" wrangler.toml
            rm -f wrangler.toml.bak
          fi

      - name: Inject Cloudflare Access trusted service client ids (optional; GitHub Secret)
        working-directory: apps/worker
        env:
          INJECT_TRUSTED_SERVICE: ${{ secrets.CLOUDFLARE_ACCESS_TRUSTED_SERVICE_CLIENT_IDS }}
        run: |
          if [ -n "$INJECT_TRUSTED_SERVICE" ]; then
            sed -i.bak "s|^CLOUDFLARE_ACCESS_TRUSTED_SERVICE_CLIENT_IDS = .*|CLOUDFLARE_ACCESS_TRUSTED_SERVICE_CLIENT_IDS = \"${INJECT_TRUSTED_SERVICE}\"|" wrangler.toml
            rm -f wrangler.toml.bak
          fi

      - name: Inject INCLUDE_SESSION_TOKEN_IN_LOGIN_BODY (optional; GitHub Secret LH_SESSION_TOKEN_IN_LOGIN_BODY)
        working-directory: apps/worker
        env:
          INJECT_SESSION_TOKEN_BODY: ${{ secrets.LH_SESSION_TOKEN_IN_LOGIN_BODY }}
        run: |
          if [ -n "$INJECT_SESSION_TOKEN_BODY" ]; then
            sed -i.bak "s|^INCLUDE_SESSION_TOKEN_IN_LOGIN_BODY = .*|INCLUDE_SESSION_TOKEN_IN_LOGIN_BODY = \"${INJECT_SESSION_TOKEN_BODY}\"|" wrangler.toml
            rm -f wrangler.toml.bak
          fi

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy
