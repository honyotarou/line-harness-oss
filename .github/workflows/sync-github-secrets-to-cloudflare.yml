# Every push to `main` dispatches the two deploy workflows so GitHub Repository secrets
# (WORKER_URL, LIFF_URL, Access vars, ADMIN_ACCESS_PROXY_*, D1_DATABASE_ID, proxy service tokens, …)
# are re-injected / re-synced to Cloudflare without editing only secrets in the UI.
#
# Note: Changing secrets in GitHub alone does not run Actions; push any commit to `main`
# (or run Deploy Worker / Deploy admin Access proxy manually).
name: Sync GitHub secrets to Cloudflare

on:
  push:
    branches: [main]

concurrency:
  group: sync-github-secrets-to-cloudflare-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  dispatch-deploys:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Deploy Worker (line-crm)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-worker.yml --ref "${{ github.ref_name }}"

      - name: Dispatch Deploy admin Access proxy Worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-admin-access-proxy.yml --ref "${{ github.ref_name }}"
