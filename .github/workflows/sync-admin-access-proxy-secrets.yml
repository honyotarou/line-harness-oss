# Push では起動しません。GitHub の Repository secrets だけ更新したときは、
# Actions → 「Sync admin Access proxy secrets」→ Run workflow を実行してください。
name: Sync admin Access proxy secrets

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Push service token to Cloudflare Worker secrets
        working-directory: apps/admin-access-proxy-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.ADMIN_ACCESS_PROXY_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.ADMIN_ACCESS_PROXY_CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CF_ACCESS_CLIENT_ID:-}" ] || [ -z "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
            echo "::error::Set GitHub repository secrets ADMIN_ACCESS_PROXY_CF_ACCESS_CLIENT_ID and ADMIN_ACCESS_PROXY_CF_ACCESS_CLIENT_SECRET (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          printf '%s' "$CF_ACCESS_CLIENT_ID" | pnpm exec wrangler secret put CF_ACCESS_CLIENT_ID
          printf '%s' "$CF_ACCESS_CLIENT_SECRET" | pnpm exec wrangler secret put CF_ACCESS_CLIENT_SECRET
          echo "Worker secrets updated for line-harness-admin-access-proxy (verify in Cloudflare dashboard)."
