# Push では起動しません。GitHub の Repository secrets だけ更新しデプロイまで不要なときは、
# Actions → 「Sync admin Access proxy secrets」→ Run workflow。
# main へ push すれば deploy-admin-access-proxy.yml も走りデプロイ＋同期されます。
#
# Worker へは wrangler secret bulk（cloudflare/wrangler-action）で送ります。
# pnpm exec へのパイプは環境によって空入力になり得るため使いません。
name: Sync admin Access proxy secrets

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Require Cloudflare + proxy token secrets
        run: |
          set -euo pipefail
          missing=
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && missing="${missing} CLOUDFLARE_API_TOKEN"
          [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && missing="${missing} CLOUDFLARE_ACCOUNT_ID"
          [ -z "${{ secrets.ADMIN_ACCESS_PROXY_CF_ACCESS_CLIENT_ID }}" ] && missing="${missing} ADMIN_ACCESS_PROXY_CF_ACCESS_CLIENT_ID"
          [ -z "${{ secrets.ADMIN_ACCESS_PROXY_CF_ACCESS_CLIENT_SECRET }}" ] && missing="${missing} ADMIN_ACCESS_PROXY_CF_ACCESS_CLIENT_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Upload secrets to Worker (line-harness-admin-access-proxy)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/admin-access-proxy-worker
          packageManager: pnpm
          # deploy はしない。uploadSecrets のあと whoami のみ（認証確認）。
          command: whoami
          secrets: |
            CF_ACCESS_CLIENT_ID
            CF_ACCESS_CLIENT_SECRET
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.ADMIN_ACCESS_PROXY_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.ADMIN_ACCESS_PROXY_CF_ACCESS_CLIENT_SECRET }}
