name: Deploy admin Access proxy Worker

# Secrets (reuse Worker deploy):
# - CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (required)
# Proxy service token (GitHub → Worker secrets; synced after each deploy):
# - ADMIN_ACCESS_PROXY_CF_ACCESS_CLIENT_ID
# - ADMIN_ACCESS_PROXY_CF_ACCESS_CLIENT_SECRET
# Optional (production host injection; sed before deploy):
# - ADMIN_ACCESS_PROXY_UPSTREAM_ORIGIN (e.g. https://api.example.com)
# - ADMIN_ACCESS_PROXY_ROUTE_PATTERN + ADMIN_ACCESS_PROXY_ZONE_NAME (e.g. example.com/api/lh-upstream/* + example.com)
# If those two are unset, deploy still runs (forks); set them in production so the proxy can reach API Access.
#
# 重要: Repository secrets を編集しただけでは Actions は走りません。次のどちらかが必要です。
# - Actions → 本 workflow を「Run workflow」で手動実行（手動時、CF 用シークレット未設定ならジョブ失敗）
# - または sync-admin-access-proxy-secrets.yml を手動実行（デプロイなしで Secret のみ反映）
# - または main へ proxy 関連パスの push

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/admin-access-proxy-worker/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-admin-access-proxy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @line-crm/shared build

      - name: Inject upstream + custom route (optional GitHub Secrets)
        working-directory: apps/admin-access-proxy-worker
        env:
          UPSTREAM: ${{ secrets.ADMIN_ACCESS_PROXY_UPSTREAM_ORIGIN }}
          ROUTE: ${{ secrets.ADMIN_ACCESS_PROXY_ROUTE_PATTERN }}
          ZONE: ${{ secrets.ADMIN_ACCESS_PROXY_ZONE_NAME }}
        run: |
          set -e
          if [ -n "$UPSTREAM" ]; then
            sed -i.bak 's|https://YOUR_UPSTREAM_API_ORIGIN|'"$UPSTREAM"'|g' wrangler.toml && rm -f wrangler.toml.bak
          fi
          if [ -n "$ROUTE" ] && [ -n "$ZONE" ]; then
            printf '\nroutes = [\n  { pattern = "%s", zone_name = "%s" },\n]\n' "$ROUTE" "$ZONE" >> wrangler.toml
          fi

      - name: Detect admin proxy Access service token secrets
        id: proxy_cf
        run: |
          if [ -n "${{ secrets.ADMIN_ACCESS_PROXY_CF_ACCESS_CLIENT_ID }}" ] && [ -n "${{ secrets.ADMIN_ACCESS_PROXY_CF_ACCESS_CLIENT_SECRET }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require proxy CF Access secrets on manual deploy
        if: github.event_name == 'workflow_dispatch' && steps.proxy_cf.outputs.present != 'true'
        run: |
          echo "::error::Manual deploy requires ADMIN_ACCESS_PROXY_CF_ACCESS_CLIENT_ID and ADMIN_ACCESS_PROXY_CF_ACCESS_CLIENT_SECRET. Set them under Settings → Secrets and variables → Actions."
          exit 1

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/admin-access-proxy-worker
          packageManager: pnpm
          command: deploy

      - name: Upload CF Access service token to Worker secrets
        if: steps.proxy_cf.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/admin-access-proxy-worker
          packageManager: pnpm
          command: whoami
          secrets: |
            CF_ACCESS_CLIENT_ID
            CF_ACCESS_CLIENT_SECRET
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.ADMIN_ACCESS_PROXY_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.ADMIN_ACCESS_PROXY_CF_ACCESS_CLIENT_SECRET }}
